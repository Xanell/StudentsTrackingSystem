{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>
        {% if action == "create" %}Новый предмет{% else %}Редактирование: {{ subject.name }}{% endif %}
    </h1>
</div>

<form method="post" class="form">
    {% csrf_token %}

    <div class="form-group">
        <label for="name">Название предмета</label>
        <input type="text" id="name" name="name" required value="{{ subject.name|default:'' }}" maxlength="50">
    </div>

    <div class="form-group">
        <label for="short_name">Сокращенное название</label>
        <input type="text" id="short_name" name="short_name" value="{{ subject.short_name|default:'' }}" placeholder="Может быть пустым" maxlength="10">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-submit">
            {% if action == "create" %}Создать{% else %}Сохранить{% endif %}
        </button>
        <a href="{% url 'subjects' %}" class="btn-cancel">Отмена</a>
    </div>
</form>
{% endblock %}
